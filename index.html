<style>
:root {
  --bg: #E6EFFA;
  --paper: #FFFFFF;
  --ink: #3B2F3F;
  --mute: #6D6578;
  --sun: #FFC94A;
  --sun-ink: #3B2F3F;
  --ring: #F2668B;
  --line: #3B2F3F;
  --cardH: min(42svh, 440px);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D2032; --paper: #2A2E45; --ink: #F0ECF7; --mute: #ADA6BE; --line: #F0ECF7; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D2032; --paper: #2A2E45; --ink: #F0ECF7; --mute: #ADA6BE; --line: #F0ECF7; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  font-weight: 500; line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

.top { display: flex; align-items: center; gap: 10px; padding: 14px 18px 4px; max-width: 1100px; margin: 0 auto; }
.logo { position: relative; width: 34px; height: 20px; flex: none; }
.logo::before { content: ""; position: absolute; left: 2px; right: 2px; bottom: 0; height: 15px; border-radius: 15px 15px 0 0; background: var(--sun); border: 2.5px solid var(--line); border-bottom: 0; }
.logo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.5px; background: var(--line); border-radius: 2px; }
.top p { margin: 0; font-size: 12px; font-weight: 700; color: var(--mute); line-height: 1.2; }
.top h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: .04em; line-height: 1.25; }

.layout { max-width: 1100px; margin: 0 auto; padding: 0 0 calc(110px + env(safe-area-inset-bottom, 0px)); }
.stage { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 10px 16px 12px; }
.card {
  height: var(--cardH); aspect-ratio: 4 / 5; margin: 0 auto;
  border: 3px solid var(--line); border-radius: 22px; overflow: hidden;
  box-shadow: 5px 5px 0 var(--line); background: #fff;
}
.card svg { display: block; width: 100%; height: 100%; }
.card.bump { animation: bump .42s cubic-bezier(.3,1.6,.5,1); }
@keyframes bump { 0% { transform: scale(.94) rotate(-1.5deg); } 100% { transform: none; } }

.studio { padding: 0 16px; }
.tabs {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--cardH) + 22px); z-index: 4;
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px; margin: 0 -16px; padding-inline: 16px;
  background: var(--bg); scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; font: inherit; font-weight: 800; font-size: 15px; color: var(--ink);
  background: var(--paper); border: 2.5px solid var(--line); border-radius: 999px; padding: 6px 16px; cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--line); color: var(--bg); }

.panel { padding: 4px 0 8px; }
.group { margin: 0 0 18px; }
.group h3 { margin: 0 0 8px; font-size: 13px; font-weight: 800; color: var(--mute); letter-spacing: .03em; }
.hint { margin: 2px 0 12px; font-size: 14px; color: var(--mute); }
.small { font-size: 12px; color: var(--mute); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-weight: 700; font-size: 15px; color: var(--ink); cursor: pointer;
  background: var(--paper); border: 2.5px solid var(--line); border-radius: 999px; padding: 6px 14px; min-height: 40px;
  box-shadow: 2px 2px 0 var(--line); transition: transform .08s;
}
.chip:active { transform: translate(2px, 2px); box-shadow: none; }
.chip[aria-pressed="true"] { background: var(--sun); color: var(--sun-ink); }

.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw {
  position: relative; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; padding: 0;
  background: var(--c); border: 2.5px solid var(--line); box-shadow: 2px 2px 0 var(--line);
}
.sw[aria-pressed="true"], .sw-custom.is-on { outline: 3px solid var(--ring); outline-offset: 3px; }
.sw-custom { display: grid; place-items: center; background: conic-gradient(#FF8FA3, #FFC94A, #9FD8C2, #8DB4E3, #9C7CC2, #FF8FA3); }
.sw-custom.is-on { background: var(--c); }
.sw-custom span { font-weight: 800; font-size: 18px; color: #3B2F3F; line-height: 1; background: #fff; border-radius: 50%; width: 22px; height: 22px; display: grid; place-items: center; }
.sw-custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.field {
  flex: 1 1 200px; font: inherit; font-size: 16px; font-weight: 700; color: var(--ink);
  background: var(--paper); border: 2.5px solid var(--line); border-radius: 14px; padding: 8px 12px; resize: none;
}

.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.preset {
  font: inherit; font-weight: 800; font-size: 13px; color: var(--ink); cursor: pointer;
  background: var(--paper); border: 2.5px solid var(--line); border-radius: 16px; padding: 6px 4px 4px;
  box-shadow: 2px 2px 0 var(--line); display: grid; justify-items: center; gap: 0;
}
.preset svg { width: 100%; height: auto; aspect-ratio: 400 / 420; display: block; }
.preset:active { transform: translate(2px, 2px); box-shadow: none; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  display: flex; gap: 10px; justify-content: center;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--bg); border-top: 2.5px solid var(--line);
}
.btn {
  flex: 1 1 0; max-width: 260px; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer;
  border: 3px solid var(--line); border-radius: 999px; padding: 11px 16px; color: var(--ink); background: var(--paper);
  box-shadow: 3px 3px 0 var(--line);
}
.btn:active { transform: translate(3px, 3px); box-shadow: none; }
.btn-main { background: var(--sun); color: var(--sun-ink); }
.btn:disabled { opacity: .6; }

button:focus-visible, a:focus-visible, .field:focus-visible, .sw-custom:focus-within { outline: 3px solid var(--ring); outline-offset: 3px; }

dialog.sheet {
  width: min(440px, calc(100% - 24px)); max-height: calc(100% - 24px); padding: 18px; color: var(--ink);
  background: var(--paper); border: 3px solid var(--line); border-radius: 24px; box-shadow: 6px 6px 0 var(--line);
}
dialog.sheet::backdrop { background: rgba(30, 24, 40, .45); }
.sheet h2 { margin: 0 0 10px; font-size: 20px; font-weight: 800; }
.sheet img { display: block; width: 100%; max-height: 52svh; object-fit: contain; border-radius: 14px; border: 2.5px solid var(--line); background: #fff; -webkit-touch-callout: default; }
.sheet .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.sheet .acts .btn { flex: 1 1 140px; font-size: 16px; text-align: center; text-decoration: none; padding: 10px 12px; }
.sheet .note { margin: 10px 0 0; font-size: 13px; color: var(--mute); }
.sheet .msg { margin: 8px 0 0; font-size: 14px; font-weight: 700; min-height: 1.2em; }

.toast {
  position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  background: var(--line); color: var(--bg); font-weight: 700; font-size: 14px; padding: 8px 16px; border-radius: 999px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; max-width: calc(100% - 32px);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 880px) {
  :root { --cardH: min(78vh, 620px); }
  .top { padding: 22px 28px 6px; }
  .top h1 { font-size: 28px; }
  .layout { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: start; padding: 0 28px calc(110px + env(safe-area-inset-bottom, 0px)); }
  .stage { top: calc(env(safe-area-inset-top, 0px) + 16px); padding: 12px 0; }
  .studio { padding: 12px 0 0; }
  .tabs { position: static; flex-wrap: wrap; margin: 0; padding: 0 0 14px; }
  .presets { grid-template-columns: repeat(4, minmax(0, 130px)); }
}
@media (prefers-reduced-motion: reduce) {
  .card.bump { animation: none; }
  .chip, .toast { transition: none; }
}
</style>
</head>
<body>
<header class="top">
  <span class="logo" aria-hidden="true"></span>
  <div><p>あさひにっき</p><h1>ソーラメーカー</h1></div>
</header>
<main class="layout">
  <section class="stage" aria-label="プレビュー">
    <div id="card" class="card" role="img"></div>
  </section>
  <section class="studio">
    <nav id="tabs" class="tabs" role="tablist" aria-label="パーツ"></nav>
    <div id="panel" class="panel" role="tabpanel"></div>
  </section>
</main>
<div class="bar">
  <button type="button" class="btn" id="rand">おまかせ</button>
  <button type="button" class="btn btn-main" id="save">画像にする</button>
</div>
<dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
  <h2 id="sheetTitle">できあがり！</h2>
  <img id="shot" alt="">
  <div class="acts">
    <button type="button" class="btn btn-main" id="dl">保存する</button>
    <button type="button" class="btn btn-main" id="share" hidden>共有する</button>
    <a class="btn" id="post" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener">Xに投稿</a>
    <button type="button" class="btn" id="close">とじる</button>
  </div>
  <p class="msg" id="msg" role="status"></p>
  <p class="note">画像は長押しでも保存できます。Xに投稿するときは、保存した画像をつけてね。</p>
</dialog>
<div class="toast" id="toast" role="status"></div>
<script>
/* ===== data ===== */
const TONES = {

  teinei: { label: 'ていねい', lines: ['{n}と申します。どうぞよろしくお願いいたします。', 'はじめまして、{n}です。お見知りおきを。'] },

const NAMES = ['ポポ', 'ルル', 'ミント', 'ソラ', 'キキ', 'モモ', 'ラテ', 'ココ', 'チャイ', 'ユズ', 'ネネ', 'リリ', 'トト', 'ナナ', 'ムギ', 'シロ', 'クルミ', 'メル', 'ハク', 'ルナ', 'ペコ', 'ミル'];

const PAL = {
  main: [['#FBF5F6', 'しろ'], ['#FBF2BC', 'クリーム'], ['#F8B9C8', 'ピンク'], ['#9C7CC2', 'むらさき'], ['#7E2148', 'ワイン'], ['#E5B566', 'きんいろ'], ['#262B57', 'こん'], ['#3F6070', 'あおみどり'], ['#8DB4E3', 'みずいろ'], ['#F6B37C', 'オレンジ'], ['#9FD8C2', 'ミント'], ['#8E6A55', 'ちゃいろ'], ['#B8B6C8', 'グレー'], ['#3A3440', 'くろ']],
  light: [['#FFFFFF', 'しろ'], ['#FBF1E4', 'きなり'], ['#FFF9DE', 'レモン'], ['#FCDDE4', 'さくら'], ['#E4DAF4', 'ラベンダー'], ['#DDEBFA', 'そら'], ['#DDF3E8', 'わかば'], ['#F8E2B0', 'はちみつ']],
  inner: [['#F2B2B9', 'ピンク'], ['#F380AA', 'こいピンク'], ['#E9A9C7', 'ローズ'], ['#EB9C86', 'サーモン'], ['#3F6CE6', 'あお'], ['#4A0F25', 'こげちゃ'], ['#F8E2B0', 'クリーム'], ['#BFD4F2', 'みずいろ']],
  eye: [['#3B86D9', 'あお'], ['#3858CC', 'こん'], ['#9B6FB5', 'むらさき'], ['#C2372E', 'あか'], ['#B9711F', 'こはく'], ['#7C4A1E', 'ちゃいろ'], ['#3F9A6E', 'みどり'], ['#E0679A', 'ピンク'], ['#2E2A35', 'くろ']],
  hair: [['#FBF5F6', 'しろ'], ['#FCF4C8', 'クリーム'], ['#FDE3EA', 'さくら'], ['#C7A3DE', 'ラベンダー'], ['#8A2450', 'ワイン'], ['#E9BC68', 'きんいろ'], ['#262B57', 'こん'], ['#3F6070', 'あおみどり'], ['#8DB4E3', 'みずいろ'], ['#F6B37C', 'オレンジ'], ['#8E6A55', 'ちゃいろ'], ['#3A3440', 'くろ']],
  clothes: [['#232027', 'くろ'], ['#FBF8F3', 'しろ'], ['#2F4A8A', 'あお'], ['#B33A4A', 'あか'], ['#F2C14E', 'きいろ'], ['#6FB58E', 'みどり'], ['#E8A0BF', 'ピンク'], ['#262B57', 'こん'], ['#8E6A55', 'ちゃいろ']],
  accent: [['#C3202F', 'あか'], ['#A779CF', 'むらさき'], ['#F28AB2', 'ピンク'], ['#3B86D9', 'あお'], ['#F2C14E', 'きいろ'], ['#6E1E35', 'えんじ'], ['#2E2A35', 'くろ']],
  mark: [['#2B2026', 'くろ'], ['#3A0B1E', 'えんじ'], ['#E7A6CC', 'ピンク'], ['#3B86D9', 'あお'], ['#E8A33A', 'きん'], ['#FFFFFF', 'しろ']],
  bg: [['#DCEBFA', 'そら'], ['#FFE7D6', 'あさやけ'], ['#FFF1CF', 'ひだまり'], ['#FFE4EC', 'さくら'], ['#F3E6F7', 'ゆうぐれ'], ['#E0EFEC', 'ミント'], ['#E1E6FA', 'よぞら'], ['#F4F1F6', 'くもり']],
};

const BASE = {
  name: 'ソーラ', body: 'normal', ears: 'pin', main: '#FBF5F6', sub: '#8DB4E3', fluff: '#FFFFFF', inner: '#F2B2B9',
  pattern: 'none', face: 'none', eyes: 'kira', eyeColor: '#3B86D9', mouth: 'cat', blush: 'on',
  hair: 'none', hairColor: '#FBF5F6', tail: 'fluffy', tipOn: 'off', tipColor: '#FFFFFF',
  clothes: 'none', clothesColor: '#232027', accent: '#C3202F', acc: {},
  mark: 'sora', markColor: '#2B2026', tone: 'genki', lineIdx: 0, lineAuto: true, line: '',
  bg: '#DCEBFA', bgDeco: 'sun',
};

const PRESETS = [
  { name: 'マーリ', main: '#FBF5F6', sub: '#8DB4E3', fluff: '#FFFFFF', inner: '#F2B2B9', pattern: 'zigzag', eyes: 'kira', eyeColor: '#3B86D9', mouth: 'cat', tail: 'fluffy', mark: 'sora', tone: 'genki', bg: '#DCEBFA', bgDeco: 'sun' },
  { name: 'モカ', body: 'slim', main: '#9C7CC2', sub: '#9C7CC2', fluff: '#FFFFFF', inner: '#E9A9C7', pattern: 'belly', face: 'muzzle', eyes: 'jito', eyeColor: '#9B6FB5', mouth: 'mu', hair: 'long', hairColor: '#C7A3DE', tail: 'fluffy', tipOn: 'on', tipColor: '#F2A9C4', clothes: 'dress', clothesColor: '#FFFFFF', accent: '#A779CF', acc: { ribbon: true }, mark: 'maro', markColor: '#E7A6CC', tone: 'cool', bg: '#F3E6F7', bgDeco: 'kira' },
  { name: 'ブラット', main: '#7E2148', sub: '#7E2148', fluff: '#7E2148', inner: '#4A0F25', eyes: 'kiri', eyeColor: '#6E4A3C', mouth: 'mu', blush: 'off', hair: 'pomp', hairColor: '#8A2450', tail: 'thin', clothes: 'suit', clothesColor: '#232027', accent: '#6E1E35', acc: { glasses: true }, mark: 'sora', markColor: '#3A0B1E', tone: 'teinei', bg: '#F4F1F6', bgDeco: 'none' },
  { name: 'ジュノ', main: '#E5B566', sub: '#E5B566', fluff: '#F8E2B0', inner: '#F8E2B0', face: 'muzzle', eyes: 'kiri', eyeColor: '#7C4A1E', mouth: 'cat', hair: 'side', hairColor: '#E9BC68', tail: 'curl', clothes: 'suit', clothesColor: '#FBF8F3', accent: '#C3202F', acc: { crown: true }, mark: 'none', tone: 'oresama', bg: '#FFF1CF', bgDeco: 'kira' },
  { name: 'ピーチ', main: '#FBF2BC', sub: '#F6B37C', fluff: '#FFF9DE', inner: '#F380AA', pattern: 'zigzag', eyes: 'kiri', eyeColor: '#C2372E', mouth: 'cat', hair: 'tuft', hairColor: '#FCF4C8', tail: 'fluffy', mark: 'sora', tone: 'ojou', bg: '#FFE7D6', bgDeco: 'sun' },
  { name: 'クク', body: 'chubby', main: '#F8B9C8', sub: '#F8B9C8', fluff: '#FCDDE4', inner: '#F2908E', eyes: 'maru', mouth: 'open', hair: 'moko', hairColor: '#FDE3EA', tail: 'pom', tipOn: 'on', tipColor: '#FDE3EA', mark: 'none', tone: 'nanoda', bg: '#FFE4EC', bgDeco: 'dots' },
  { name: 'コハイ', body: 'chubby', main: '#262B57', sub: '#262B57', fluff: '#F7E9DD', inner: '#3F6CE6', pattern: 'belly', face: 'mask', eyes: 'kira', eyeColor: '#3858CC', mouth: 'cat', hair: 'bosa', hairColor: '#262B57', tail: 'pom', tipOn: 'on', tipColor: '#C8CEF7', clothes: 'bowtie', clothesColor: '#262B57', mark: 'none', tone: 'nonbiri', bg: '#E1E6FA', bgDeco: 'kira' },
  { name: 'アイス', main: '#3F6070', sub: '#FBF1E4', fluff: '#FBF1E4', inner: '#EB9C86', pattern: 'bellysocks', face: 'mask', ears: 'yoko', eyes: 'kira', eyeColor: '#B9711F', mouth: 'cat', hair: 'piyo', hairColor: '#3F6070', tail: 'fluffy', tipOn: 'on', tipColor: '#FBF1E4', mark: 'sora', tone: 'ssu', bg: '#E0EFEC', bgDeco: 'sun' },
];

function lineFor(s) {
  const t = TONES[s.tone] || TONES.genki;
  const tpl = t.lines[(s.lineIdx || 0) % t.lines.length];
  return tpl.replace(/\{n\}/g, (String(s.name || '').trim() || 'ソーラ'));
}
function fromPreset(p) {
  const s = Object.assign({}, BASE, JSON.parse(JSON.stringify(p)));
  s.acc = Object.assign({}, p.acc || {});
  s.lineAuto = true; s.lineIdx = 0; s.line = lineFor(s);
  return s;
}

if (typeof module !== 'undefined') module.exports = { TONES, NAMES, PAL, BASE, PRESETS, lineFor, fromPreset };

/* ===== ソーラ renderer ===== */
const LINE = '#3B2F3F';
const FONT = "'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP','Noto Sans CJK JP',sans-serif";

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function hexToRgb(h) {
  h = String(h || '#000').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16) || 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}
function mix(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return rgbToHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
}
function lum(h) { const [r, g, b] = hexToRgb(h); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }
function esc(t) {

/* eyes are drawn in local space around (0,0); right eye is mirrored */
function spiralPath() {
  let d = '';
  for (let i = 0; i <= 64; i++) {
    const t = i / 64 * 4 * Math.PI, r = 1 + t * 1.0;
    d += (i ? 'L' : 'M') + n1(r * Math.cos(t)) + ' ' + n1(r * Math.sin(t)) + ' ';
  }
  return d;
}

/* ---------- speech text wrapping ---------- */
const NO_START = '、。，．！？!?…ー〜」』）)ぁぃぅぇぉっゃゅょァィゥェォッャュョ';
function wrapText(text, max, maxLines) {
  const chars = Array.from(String(text || '').replace(/\s+/g, ' ').trim());
  const lines = [];
  let cur = '', w = 0;
  for (const ch of chars) {
    const cw = /[\x20-\x7e]/.test(ch) ? 0.55 : 1;
    if (w + cw > max && cur) {
      if (NO_START.includes(ch)) { cur += ch; w += cw; continue; }
      lines.push(cur); cur = ''; w = 0;
      if (ch === ' ') continue;
    }
    cur += ch; w += cw;
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {
    const keep = lines.slice(0, maxLines);
    keep[maxLines - 1] = Array.from(keep[maxLines - 1]).slice(0, -1).join('') + '…';
    return keep;
  }
  return lines;
}

function textWidth(t, fs) {
  return Array.from(t).reduce((a, ch) => a + (/[\x20-\x7e]/.test(ch) ? 0.58 : 1), 0) * fs;
}

function bgDeco(s) {
  const d = s.bgDeco;
  if (d === 'sun') {
    return `<circle cx="200" cy="318" r="182" fill="#fff" opacity=".22"/><circle cx="200" cy="318" r="128" fill="#fff" opacity=".28"/><circle cx="200" cy="318" r="74" fill="#fff" opacity=".3"/>`;
  }
  if (d === 'dots') {
    let o = '';
    for (let y = 18; y < 500; y += 34) for (let x = (y / 34) % 2 ? 34 : 17; x < 400; x += 34) o += `<circle cx="${x}" cy="${y}" r="4"/>`;
    return `<g fill="#fff" opacity=".55">${o}</g>`;
  }
  if (d === 'kira') {
    const pts = [[48, 150, 12], [352, 170, 10], [70, 330, 8], [338, 360, 13], [40, 420, 7], [368, 270, 7], [300, 120, 6], [100, 230, 6]];
    return `<g fill="#fff" opacity=".85">${pts.map(([x, y, r]) => `<path transform="translate(${x} ${y})" d="M0 ${-r} Q${r * .18} ${-r * .18} ${r} 0 Q${r * .18} ${r * .18} 0 ${r} Q${-r * .18} ${r * .18} ${-r} 0 Q${-r * .18} ${-r * .18} 0 ${-r} Z"/>`).join('')}</g>`;
  }
  return '';
}

/* full share card, 400x500 (4:5) */
function cardSVG(s, id = 'c', opts = {}) {
  const lines = wrapText(s.line, 16, 3);
  const fs = 17.5, lh = 24;
  const by = 16, bh = 24 + lines.length * lh, r = 18;
  const hasBubble = lines.length > 0;
  const bubble = hasBubble ? `<path d="M${24 + r} ${by} H${376 - r} Q376 ${by} 376 ${by + r} V${by + bh - r} Q376 ${by + bh} ${376 - r} ${by + bh} H214 L202 ${by + bh + 14} L190 ${by + bh} H${24 + r} Q24 ${by + bh} 24 ${by + bh - r} V${by + r} Q24 ${by} ${24 + r} ${by} Z" fill="#fff" stroke="${LINE}" stroke-width="3" stroke-linejoin="round"/>
    <g font-family="${esc(FONT)}" font-size="${fs}" font-weight="700" fill="${LINE}" text-anchor="middle">${lines.map((t, i) => `<text x="200" y="${n1(by + 12 + fs + i * lh)}">${esc(t)}</text>`).join('')}</g>` : '';
  const name = String(s.name || '').trim() || 'ソーラ';
  const maxPlate = 196;
  let nfs = 16, nw = textWidth(name, nfs) + 34;
  if (nw > maxPlate) { nfs = Math.max(10, (maxPlate - 34) / (textWidth(name, 1))); nw = maxPlate; }
  const plate = `<rect x="22" y="452" width="${n1(nw)}" height="32" rx="16" fill="${LINE}"/>
    <text x="${n1(22 + nw / 2)}" y="474" font-family="${esc(FONT)}" font-size="${nfs}" font-weight="800" fill="#fff" text-anchor="middle">${esc(name)}</text>
    <text x="378" y="474" font-family="${esc(FONT)}" font-size="12" font-weight="700" fill="${LINE}" fill-opacity=".62" text-anchor="end">#あさひにっき #ソーラメーカー</text>`;
  const size = opts.width ? `width="${opts.width}" height="${opts.width * 1.25}"` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" ${size}>
  <rect width="400" height="500" fill="${s.bg}"/>
  ${bgDeco(s)}
  <ellipse cx="200" cy="444" rx="86" ry="9" fill="${LINE}" opacity=".12"/>
  <g transform="translate(28 64) scale(.86)">${charSVG(s, id)}</g>
  ${bubble}
  ${plate}
</svg>`;
}

/* small preview of just the character */
function thumbSVG(s, id) {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 400 420" aria-hidden="true">${charSVG(s, id)}</svg>`;
}

      body = `<div class="chips" role="group" aria-label="${g.label}">${g.opts.map(([v, l]) => `<button type="button" class="chip" data-key="${g.key}" data-val="${v}" aria-pressed="${S[g.key] === v}">${l}</button>`).join('')}</div>`;
    } else if (g.type === 'toggles') {
      body = `<div class="chips" role="group" aria-label="${g.label}">${g.opts.map(([v, l]) => `<button type="button" class="chip" data-toggle="${g.key}" data-val="${v}" aria-pressed="${!!(S[g.key] || {})[v]}">${l}</button>`).join('')}</div>`;
    } else if (g.type === 'color') {
      body = swatches(g);
    } else if (g.type === 'name') {
      body = `<div class="row"><input id="nameIn" class="field" type="text" maxlength="12" value="${esc(S.name)}" autocomplete="off" aria-label="なまえ"><button type="button" class="chip" id="nameDice">ランダム</button></div>`;
    } else if (g.type === 'line') {
      body = `<div class="row"><textarea id="lineIn" class="field" rows="2" maxlength="44" aria-label="セリフ">${esc(S.line)}</textarea></div>
        <div class="row"><button type="button" class="chip" id="lineNext">べつのセリフ</button><span class="small">じぶんで書きかえてもOK</span></div>`;
    }
    return `<section class="group"><h3>${g.label}</h3>${body}</section>`;
  }).join('');
}

function renderAll() { renderCard(); renderTabs(); renderPanel(); }

tabsEl.addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; renderTabs(); renderPanel();
  b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
});

panelEl.addEventListener('click', e => {
  const p = e.target.closest('[data-preset]');
  if (p) { S = fromPreset(PRESETS[+p.dataset.preset]); renderCard(); bump(); return; }
  const b = e.target.closest('button[data-key]');
  if (b) {
    S[b.dataset.key] = b.dataset.val;
    if (b.dataset.key === 'tone') { S.lineAuto = true; S.lineIdx = 0; }
    renderCard(); renderPanel(); return;
  }
  const tg = e.target.closest('[data-toggle]');
  if (tg) {
    const k = tg.dataset.toggle; S[k] = Object.assign({}, S[k]); S[k][tg.dataset.val] = !S[k][tg.dataset.val];
    renderCard(); renderPanel(); return;
  }
  if (e.target.id === 'nameDice') {
    S.name = pick(NAMES.filter(n => n !== S.name)); renderCard(); renderPanel(); return;
  }
  if (e.target.id === 'lineNext') {
    S.lineAuto = true; S.lineIdx = (S.lineIdx || 0) + 1; renderCard(); renderPanel(); return;
  }
});

panelEl.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('input[type=color]')) { S[t.dataset.key] = t.value; renderCard(); return; }
  if (t.id === 'nameIn') { S.name = t.value; renderCard(); if (S.lineAuto) { const li = $('#lineIn'); if (li) li.value = S.line; } return; }
  if (t.id === 'lineIn') { S.lineAuto = false; S.line = t.value; renderCard(); return; }
});
panelEl.addEventListener('change', e => { if (e.target.matches('input[type=color]')) renderPanel(); });

function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function bump() {
  cardEl.classList.remove('bump'); void cardEl.offsetWidth; cardEl.classList.add('bump');
}

function randomize() {
  const opt = key => { for (const t of TABS) for (const g of (t.groups || [])) if (g.key === key && g.opts) return pick(g.opts)[0]; };
  const col = pal => pick(PAL[pal])[0];
  const r = {
    name: pick(NAMES), body: opt('body'), ears: Math.random() < .6 ? 'pin' : opt('ears'),
    main: col('main'), sub: col(Math.random() < .5 ? 'main' : 'light'), fluff: col('light'), inner: col('inner'),
    pattern: opt('pattern'), face: Math.random() < .55 ? 'none' : opt('face'),
    eyes: opt('eyes'), eyeColor: col('eye'), mouth: opt('mouth'), blush: Math.random() < .8 ? 'on' : 'off',
    hair: opt('hair'), tail: opt('tail') , tipOn: Math.random() < .45 ? 'on' : 'off', tipColor: col('light'),
    clothes: Math.random() < .45 ? 'none' : opt('clothes'), clothesColor: col('clothes'), accent: col('accent'),
    acc: { crown: Math.random() < .18, glasses: Math.random() < .18, ribbon: Math.random() < .2, flower: Math.random() < .15 },
    mark: Math.random() < .5 ? 'sora' : opt('mark'), tone: opt('tone'), lineIdx: Math.floor(Math.random() * 3), lineAuto: true,
    bg: col('bg'), bgDeco: opt('bgDeco'),
  };
  if (r.tail === 'none' && Math.random() < .7) r.tail = 'fluffy';
  r.hairColor = Math.random() < .55 ? r.main : col('hair');
  r.markColor = lum(r.main) < .35 || (r.face === 'mask' && lum(r.fluff) < .35) ? pick(['#FFFFFF', '#E8A33A', '#E7A6CC']) : pick(['#2B2026', '#2B2026', '#3B86D9', '#E8A33A']);
  if (r.face === 'mask' && lum(r.fluff) > .6) r.markColor = pick(['#2B2026', '#3B86D9']);
  S = Object.assign({}, BASE, r);
  renderCard(); renderPanel(); bump();
}
$('#rand').addEventListener('click', randomize);

/* ----- export ----- */
const sheet = $('#sheet');
let pngBlob = null, downloads = null;

function svgToPng(svg, w, h) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      cv.toBlob(b => b ? resolve({ blob: b, url: cv.toDataURL('image/png') }) : reject(new Error('toBlob')), 'image/png');
    };
    img.onerror = () => reject(new Error('image'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

function fileName() {
  const n = (String(S.name || '').trim() || 'sora').replace(/[\\/:*?"<>|\s]+/g, '');
  return `sora-${n}.png`;
}

$('#save').addEventListener('click', async () => {
  const btn = $('#save'); btn.disabled = true; btn.textContent = 'つくってます…';
  try {
    const { blob, url } = await svgToPng(cardSVG(S, 'x', { width: 1080 }), 1080, 1350);
    pngBlob = blob;
    $('#shot').src = url;
    $('#shot').alt = `${S.name || 'ソーラ'}のカード`;
    const txt = `${(S.name || 'ソーラ').trim()}をつくったよ！`;
    const pageUrl = location.protocol.startsWith('http') ? location.href.split('#')[0] : '';
    $('#post').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(txt) + (pageUrl ? '&url=' + encodeURIComponent(pageUrl) : '') + '&hashtags=' + encodeURIComponent('あさひにっき,ソーラメーカー');
    let canShare = false;
    try { canShare = !!(navigator.canShare && navigator.canShare({ files: [new File([blob], fileName(), { type: 'image/png' })] })); } catch (e) { canShare = false; }
    $('#share').hidden = !canShare;
    $('#msg').textContent = '';
    sheet.showModal();
  } catch (e) {
    toast('画像をつくれませんでした。もう一度ためしてね。');
  } finally {
    btn.disabled = false; btn.textContent = '画像にする';
  }
});

$('#dl').addEventListener('click', () => {
  if (!pngBlob) return;
  try {
    const url = URL.createObjectURL(pngBlob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    $('#msg').textContent = '保存しました。';
  } catch (e) {
    $('#msg').textContent = '保存できないときは、画像を長押しして保存してね。';
  }
});

$('#share').addEventListener('click', async () => {
  if (!pngBlob) return;
  try {
    await navigator.share({ files: [new File([pngBlob], fileName(), { type: 'image/png' })], text: `${(S.name || 'ソーラ').trim()}をつくったよ！ #あさひにっき #ソーラメーカー ${location.protocol.startsWith('http') ? location.href.split('#')[0] : ''}`.trim() });
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    $('#share').hidden = true;
    $('#msg').textContent = 'ここでは共有できないので、画像を保存してから投稿してね。';
  }
});

$('#close').addEventListener('click', () => sheet.close());
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });

let toastT;
function toast(m) {
  const t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}

renderAll();

</script>
